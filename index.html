let state={students:[],requests:[],tasks:[],reviews:[],reports:[]};let session=null,view='overview',loginType='',notice='';const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const student=id=>state.students.find(s=>s.id===id);const status=s=>s==='pending'?'<span class="tag wait">Kutilmoqda</span>':s==='accepted'?'<span class="tag">Qabul qilingan</span>':'<span class="tag no">Rad etilgan</span>';function head(){return `<header class="top"><div class="wrap top-inner"><img class="logo" src="${LOGO}" alt="TIFT universiteti logosi"><div class="brand-right"><span>Amaliyot boshqaruv platformasi</span><button class="outline" data-go="home">Bosh sahifa</button></div></div></header>`}function home(){session=null;app.innerHTML=head()+`<main class="wrap"><section class="hero"><div class="hero-grid"><div class="hero-copy"><span class="eyebrow">TIFT universiteti · Amaliyot platformasi</span><h1>Bilimdan<br>tajriba sari.</h1><p>Universitet, tashkilot va talaba o‘rtasidagi amaliyot jarayoni — yagona qulay platformada.</p><div class="hero-actions"><button class="btn" data-login="uni">Universitetga kirish →</button><button class="outline" data-login="org">Tashkilotga kirish</button></div></div><div class="hero-photo" role="img" aria-label="TIFT universiteti binosi"></div></div></section><div class="section-title"><div><h2>O‘zingizga mos bo‘limni tanlang</h2><p>Amaliyotning har bir bosqichi bir joyda.</p></div></div><section class="portal-grid"><article class="portal"><span class="num">01 / UNIVERSITET</span><h3>Talabalarni yo‘naltiring</h3><p>Talabalar ro‘yxatini ko‘ring va tashkilotga amaliyot so‘rovini yuboring.</p><button class="text-btn" data-login="uni">Universitetga kirish →</button></article><article class="portal"><span class="num">02 / TASHKILOT</span><h3>Amaliyotni boshqaring</h3><p>So‘rovlarni qabul qiling, vazifa bering va talaba ishini baholang.</p><button class="text-btn" data-login="org">Tashkilotga kirish →</button></article><article class="portal"><span class="num">03 / KUNLIK HISOBOT</span><h3>Ishlaringizni yuklang</h3><p>Talaba ID raqami bilan kirib, har kungi bajarilgan ishni yuboring.</p><button class="text-btn" data-login="report">Hisobot yuklash →</button></article></section><div class="note"><strong>Sinov versiyasi.</strong> Ma’lumotlar serverdagi bazada saqlanadi. Boshlang‘ich parollar va nomlar sinov uchun; haqiqiy foydalanishdan oldin xavfsizlik va akkaunt sozlamalarini yangilash kerak.</div></main><footer><div class="wrap footer-flex"><span>© TIFT universiteti · Amaliyot platformasi</span><span>Ta’limdan tajribaga.</span></div></footer>`}function login(type){loginType=type;let name=type==='uni'?'Universitet xodimi':type==='org'?'Tashkilot rahbari':'Kunlik hisobot';let demo=type==='uni'?'ID: <b>UNI-001</b> &nbsp; Parol: <b>123456</b>':type==='org'?'ID: <b>TAS-001</b> – <b>TAS-010</b> &nbsp; Parol: <b>123456</b>':'ID: <b>TAL-001</b> – <b>TAL-050</b> &nbsp; Parol: <b>123456</b>';app.innerHTML=head()+`<main class="wrap"><section class="auth"><button class="back" data-go="home">← Bosh sahifaga qaytish</button><h2>${name}</h2><p class="muted">Davom etish uchun ID va parolingizni kiriting.</p><form id="loginForm"><label for="id">ID raqami</label><input id="id" name="id" placeholder="${type==='uni'?'UNI-001':type==='org'?'TAS-001':'TAL-001'}" required autocomplete="username"><label for="password">Parol</label><input id="password" name="password" type="password" placeholder="Parolni kiriting" required autocomplete="current-password"><div id="login-error"></div><button class="btn" type="submit">Kirish →</button></form><div class="credentials"><b>Sinov uchun ma’lumotlar</b><br>${demo}<br><span class="small">Bu parollar faqat namuna uchun.</span></div></section></main>`}
function dashboard(){const uni=session.type==='uni';let req=uni?state.requests:state.requests.filter(r=>r.org===session.org);let st=uni?state.students:state.students.filter(s=>req.some(r=>r.student===s.id&&r.status==='accepted'));let title=uni?'Universitet boshqaruvi':'Tashkilot boshqaruvi';let nav=uni?[['overview','Umumiy ko‘rinish'],['students','Talabalar'],['requests','Yuborilgan so‘rovlar'],['organizations','Tashkilotlar']]:[['overview','Umumiy ko‘rinish'],['requests','Kelgan so‘rovlar'],['students','Amaliyotchilar'],['reports','Kunlik hisobotlar']];let names={overview:'Umumiy ko‘rinish',students:uni?'Talabalar ro‘yxati':'Amaliyotchilar',requests:uni?'Yuborilgan so‘rovlar':'Kelgan so‘rovlar',organizations:'Tashkilotlar',reports:'Kunlik hisobotlar'};app.innerHTML=`<div class="dash"><aside class="sidebar ${uni?'':'org'}"><div class="side-logo"><img src="${LOGO}" alt="TIFT universiteti"></div><div class="side-label">${title}</div><nav class="side-nav" aria-label="Bo‘limlar">${nav.map(([k,v])=>`<button class="navbtn ${view===k?'active':''}" data-view="${k}">${v}</button>`).join('')}<button class="navbtn" data-password>Parolni o‘zgartirish</button><button class="navbtn" data-go="home">← Chiqish</button></nav><div class="side-bottom">TIFT · Amaliyot platformasi<br>Sinov versiyasi</div></aside><main class="main"><div class="dash-top"><span class="title">${uni?'TIFT universiteti':'Hamkor tashkilot'}</span><div class="account"><strong>${uni?'Universitet xodimi':esc(orgs[session.org])}</strong><br><span class="muted">${uni?'UNI-001':'TAS-'+pad(session.org+1)}</span></div></div><div class="dash-head"><div><h1>${names[view]}</h1><p>${uni?'Amaliyot jarayonini bir joyda kuzating.':'Talabalar bilan amaliyotni samarali tashkil qiling.'}</p></div><button class="outline" data-refresh>↻ Yangilash</button></div>${notice?`<div class="notice" role="status">${esc(notice)}</div><br>`:''}<div id="dash-content">${dashContent(uni,req,st)}</div></main></div>`;notice=''}
function dashContent(uni,req,st){if(view==='overview'){let counts=uni?[['Talabalar',50],['Tashkilotlar',10],['Kafedralar',10],['Kutilayotgan so‘rovlar',req.filter(r=>r.status==='pending').length]]:[['Kutilayotgan so‘rovlar',req.filter(r=>r.status==='pending').length],['Qabul qilingan',st.length],['Berilgan vazifalar',state.tasks.filter(t=>t.org===session.org).length],['Kunlik hisobotlar',state.reports.filter(r=>r.org===session.org).length]];return `<div class="stats">${counts.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><section class="panel"><div class="panel-head"><h2>${uni?'So‘nggi so‘rovlar':'Kutilayotgan so‘rovlar'}</h2><button class="text-btn" data-view="requests">Barchasini ko‘rish →</button></div>${requestList((uni?req:req.filter(r=>r.status==='pending')).slice(-5).reverse(),uni)}</section><section class="panel"><div class="panel-head"><h2>${uni?'Talabalar':'Qabul qilingan amaliyotchilar'}</h2><button class="text-btn" data-view="students">Ro‘yxatni ko‘rish →</button></div>${studentTable(st.slice(0,5),uni)}</section>`}if(view==='students')return `<section class="panel"><div class="panel-head"><h2>${uni?'50 ta talaba':'Amaliyotchilar ro‘yxati'}</h2>${uni?`<div class="filters"><input id="search" placeholder="Ism yoki ID bo‘yicha qidirish" aria-label="Talabani qidirish"><select id="dept" aria-label="Kafedra bo‘yicha filtrlash"><option value="">Barcha kafedralar</option>${depts.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div>`:''}</div><div id="student-table">${studentTable(st,uni)}</div></section>`;if(view==='requests')return `<section class="panel"><div class="panel-head"><h2>So‘rovlar</h2></div>${requestList(req.slice().reverse(),uni)}</section>`;if(view==='organizations')return `<section class="panel"><div class="panel-head"><h2>Hamkor tashkilotlar</h2></div><div class="stack">${orgs.map((o,i)=>`<div class="item"><div><strong>${esc(o)}</strong><p>TAS-${pad(i+1)} · Namuna tashkilot</p></div><span class="tag">Hamkor</span></div>`).join('')}</div></section>`;if(view==='reports')return `<section class="panel"><div class="panel-head"><h2>Yuklangan hisobotlar</h2></div>${reportsHTML(state.reports.filter(r=>r.org===session.org))}</section>`;return ''}
function studentTable(arr,uni){if(!arr.length)return '<div class="empty">Hozircha ma’lumot yo‘q.</div>';return `<div class="table-wrap"><table><thead><tr><th>Talaba</th><th>Kafedra</th><th>Kurs</th><th>Amal</th></tr></thead><tbody>${arr.map(s=>`<tr><td><strong>${esc(s.name)}</strong><small>${s.id}</small></td><td>${esc(s.dept)}</td><td>${s.course}-kurs</td><td>${uni?`<button class="action" data-send="${s.id}">So‘rov yuborish →</button>`:`<button class="action" data-manage="${s.id}">Boshqarish →</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function requestList(arr,uni){if(!arr.length)return '<div class="empty">Hozircha so‘rovlar mavjud emas.</div>';return `<div class="stack">${arr.map(r=>{let s=student(r.student);return `<div class="item"><div><strong>${esc(s?.name||r.student)}</strong><p>${r.student} · ${uni?esc(orgs[r.org]):esc(s?.dept||'')}</p></div><div class="item-actions">${status(r.status)}${!uni&&r.status==='pending'?`<button class="action" data-accept="${r.id}">Qabul qilish</button><button class="action reject" data-reject="${r.id}">Rad etish</button>`:''}</div></div>`}).join('')}</div>`}
function reportsHTML(arr){if(!arr.length)return '<div class="empty">Hozircha hisobot yuklanmagan.</div>';return `<div class="stack">${arr.slice().reverse().map(r=>`<div class="item"><div><strong>${esc(student(r.student)?.name||r.student)}</strong><p>${esc(r.date)} · ${esc(r.text)}</p>${r.file?`<a class="filelink small" href="${r.file}" download="${esc(r.filename)}">↓ ${esc(r.filename)}</a>`:''}</div><span class="tag">Yuklangan</span></div>`).join('')}</div>`}
function studentPage(){let s=student(session.id),accepted=state.requests.filter(r=>r.student===s.id&&r.status==='accepted'),tasks=state.tasks.filter(t=>t.student===s.id),reviews=state.reviews.filter(t=>t.student===s.id),reports=state.reports.filter(r=>r.student===s.id);app.innerHTML=head()+`<main class="wrap student-shell"><div class="student-head"><div><span class="eyebrow" style="color:#387351">KUNLIK HISOBOT</span><h1>Salom, ${esc(s.name)}!</h1><span class="muted">${s.id} · ${esc(s.dept)}</span></div><div><button class="outline" data-refresh>↻ Yangilash</button> <button class="outline" data-password>Parol</button> <button class="outline" data-go="home">Chiqish</button></div></div>${notice?`<div class="notice" role="status">${esc(notice)}</div><br>`:''}<div class="two"><section class="panel"><div class="panel-head"><h2>Bugungi ishingiz</h2></div>${accepted.length?`<form id="reportForm"><label for="reporg">Tashkilot</label><select id="reporg" name="org">${accepted.map(r=>`<option value="${r.org}">${esc(orgs[r.org])}</option>`).join('')}</select><label for="repdate">Sana</label><input type="date" id="repdate" name="date" required><label for="reptext">Bajarilgan ish</label><textarea id="reptext" name="text" placeholder="Bugun nimalarni bajardingiz?" required></textarea><label for="repfile">Fayl (ixtiyoriy, 1 MB gacha)</label><input id="repfile" name="file" type="file"><button class="btn" style="margin-top:18px" type="submit">Hisobotni yuborish →</button></form>`:'<p class="muted">Hisobot yuborish uchun avval tashkilot sizni amaliyotga qabul qilishi kerak.</p>'}</section><div><section class="panel"><div class="panel-head"><h2>Vazifalar</h2></div>${tasks.length?`<div class="stack">${tasks.map(t=>`<div class="item"><div><strong>${esc(t.text)}</strong><p>${esc(orgs[t.org])} · Muddat: ${esc(t.date||'Belgilanmagan')}</p></div></div>`).join('')}</div>`:'<p class="muted small">Hozircha vazifa berilmagan.</p>'}</section><section class="panel"><div class="panel-head"><h2>Baho va taqrizlar</h2></div>${reviews.length?reviews.map(r=>`<div class="item"><div><strong>Baho: ${esc(r.grade)} / 5</strong><p>${esc(r.text)}</p><p>${esc(orgs[r.org])}</p></div></div>`).join(''):'<p class="muted small">Hozircha baho qo‘yilmagan.</p>'}</section></div></div><section class="panel"><div class="panel-head"><h2>Yuborilgan hisobotlar</h2></div>${reportsHTML(reports)}</section></main>`;notice='';let d=document.getElementById('repdate');if(d)d.value=new Date().toLocaleDateString('en-CA')}
function modal(content){document.getElementById('modal').innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true">${content}</section></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function sendModal(id){let s=student(id);modal(`<h2>Amaliyotga so‘rov yuborish</h2><p class="muted">${esc(s.name)} · ${s.id}</p><form id="sendForm" data-id="${id}"><label for="orgsel">Tashkilotni tanlang</label><select id="orgsel" name="org">${orgs.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select><div class="modal-actions"><button type="button" class="outline" data-close>Bekor qilish</button><button class="btn">So‘rov yuborish</button></div></form>`)}function manageModal(id){let s=student(id);modal(`<h2>${esc(s.name)}</h2><p class="muted">${s.id} · ${esc(s.dept)}</p><div class="two"><button class="outline" data-task="${id}">Vazifa berish</button><button class="outline" data-review="${id}">Baho va taqriz</button></div><div class="modal-actions"><button class="outline" data-close>Yopish</button></div>`)}function taskModal(id){modal(`<h2>Vazifa berish</h2><p class="muted">${esc(student(id).name)}</p><form id="taskForm" data-id="${id}"><label for="tasktext">Vazifa tavsifi</label><textarea name="text" id="tasktext" required placeholder="Bajarilishi kerak bo‘lgan ish"></textarea><label for="taskdate">Bajarish muddati</label><input type="date" name="date" id="taskdate"><div class="modal-actions"><button type="button" class="outline" data-close>Bekor qilish</button><button class="btn">Vazifani saqlash</button></div></form>`)}function reviewModal(id){modal(`<h2>Baho va taqriz</h2><p class="muted">${esc(student(id).name)}</p><form id="reviewForm" data-id="${id}"><label for="grade">Baho</label><select name="grade" id="grade"><option value="5">5 — A’lo</option><option value="4">4 — Yaxshi</option><option value="3">3 — Qoniqarli</option><option value="2">2 — Qoniqarsiz</option><option value="1">1 — Past</option></select><label for="reviewtext">Taqriz</label><textarea name="text" id="reviewtext" required placeholder="Talaba faoliyati haqida yozing"></textarea><div class="modal-actions"><button type="button" class="outline" data-close>Bekor qilish</button><button class="btn">Saqlash</button></div></form>`)}
function passwordModal(){modal(`<h2>Parolni o‘zgartirish</h2><form id="passwordForm"><label for="oldpass">Eski parol</label><input id="oldpass" name="old" type="password" required autocomplete="current-password"><label for="newpass">Yangi parol (kamida 8 belgi)</label><input id="newpass" name="next" type="password" required minlength="8" maxlength="128" autocomplete="new-password"><div class="modal-actions"><button type="button" class="outline" data-close>Bekor qilish</button><button class="btn">Saqlash</button></div></form>`)}
async function api(endpoint,body={}){let res;try{res=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('Serverga ulanib bo‘lmadi. Server ishlayotganini tekshiring.')}let data=await res.json();if(!res.ok)throw new Error(data.error||'Xatolik yuz berdi.');return data}
async function refresh(){let data=await api('state');state=data.state}
function show(){session.type==='report'?studentPage():dashboard()}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.go==='home'){if(session)await api('logout').catch(()=>{});home();return}if(b.dataset.login){login(b.dataset.login);return}if(b.dataset.view){await refresh();view=b.dataset.view;dashboard();return}if(b.hasAttribute('data-refresh')){await refresh();notice='Ma’lumotlar yangilandi.';show();return}if(b.hasAttribute('data-password')){passwordModal();return}if(b.hasAttribute('data-close'))closeModal();if(b.dataset.send)sendModal(b.dataset.send);if(b.dataset.manage)manageModal(b.dataset.manage);if(b.dataset.task)taskModal(b.dataset.task);if(b.dataset.review)reviewModal(b.dataset.review);if(b.dataset.accept||b.dataset.reject){let data=await api('decision',{id:b.dataset.accept||b.dataset.reject,decision:b.dataset.accept?'accept':'reject'});state=data.state;notice=b.dataset.accept?'Talaba amaliyotga qabul qilindi.':'So‘rov rad etildi.';dashboard()}}catch(err){alert(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='search'||e.target.id==='dept'){let q=(document.getElementById('search')?.value||'').toLowerCase(),d=document.getElementById('dept')?.value||'';document.getElementById('student-table').innerHTML=studentTable(state.students.filter(s=>(s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q))&&(!d||s.dept===d)),true)}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,fd=new FormData(f),form=f.getAttribute('id'),btn=f.querySelector('button[type=submit],button.btn');if(btn)btn.disabled=true;try{
if(form==='passwordForm'){await api('password',{old:fd.get('old'),next:fd.get('next')});closeModal();notice='Parol o‘zgartirildi.';show()}
if(form==='loginForm'){let data=await api('login',{id:fd.get('id'),password:fd.get('password'),type:loginType});session=data.session;state=data.state;view='overview';show()}
if(form==='sendForm'){let data=await api('request',{student:f.dataset.id,org:Number(fd.get('org'))});state=data.state;closeModal();notice='So‘rov tashkilotga yuborildi.';dashboard()}
if(form==='taskForm'){let data=await api('task',{student:f.dataset.id,text:fd.get('text'),date:fd.get('date')});state=data.state;closeModal();notice='Vazifa saqlandi.';dashboard()}
if(form==='reviewForm'){let data=await api('review',{student:f.dataset.id,grade:fd.get('grade'),text:fd.get('text')});state=data.state;closeModal();notice='Baho va taqriz saqlandi.';dashboard()}
if(form==='reportForm'){let file=fd.get('file');if(file&&file.size>1024*1024)throw Error('Fayl 1 MB dan katta bo‘lmasin.');let encoded='';if(file&&file.size)encoded=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let data=await api('report',{org:Number(fd.get('org')),date:fd.get('date'),text:fd.get('text'),filename:file?.size?file.name:'',file:encoded});state=data.state;notice='Hisobotingiz serverga saqlandi.';studentPage()}
}catch(err){if(form==='loginForm'){let el=document.getElementById('login-error');if(el)el.innerHTML=`<div class="error" role="alert">${esc(err.message)}</div>`}else alert(err.message)}finally{if(btn)btn.disabled=false}});home();
</script></body></html>
